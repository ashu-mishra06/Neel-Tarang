# Visarjan Ghat Watch - rules readable by non-coders.
# Every threshold, limit and weight used by the engine lives here.

standard: CPCB class B (outdoor bathing)

data:
  readings_csv: data/bhopal_ghats_2023_2025.csv
  limits_csv: data/cpcb_water_quality_criteria.csv

# Column names in the organisers' CSV. The loader uses the first name it finds
# in each list. Add a name here if the organisers' file uses a different one.
readings_columns:
  ghat: [ghat, ghat_name, site, site_name]
  parameter: [parameter, param]
  value: [value, reading, result]
  flag: [flag, value_flag, remark, remarks]
  year: [year]
  festival: [festival]
  phase: [phase]
  source_page: [source_page, page]

# Flag text (case and surrounding spaces ignored).
flags:
  missing: ["not sampled", "*", "**"]          # shown as missing, never clean
  below_detection: ["BDL", "ND"]               # very low, NOT zero, NOT missing

# CPCB criteria file (columns: class, parameter, limit_type, limit, unit).
limits_csv:
  class_name: B

# Scored parameters with class B limits.
#   rule: min   -> breach if value <  low  (higher is better)
#   rule: max   -> breach if value >  high (lower is better)
#   rule: range -> breach if value outside [low, high]
#   scale: divisor that turns "how far past the limit" into 0..1 (Appendix A)
#   criteria_name: the parameter's name in the CPCB criteria CSV
# The limits below must equal the class B rows of the CPCB criteria CSV;
# load_limits() stops with an error if they differ.
scored_parameters:
  pH:
    criteria_name: pH
    rule: range
    low: 6.5
    high: 8.5
    scale: 1.5
    unit: ""
  Dissolved oxygen:
    criteria_name: Dissolved oxygen
    rule: min
    low: 5.0
    scale: 5.0
    unit: mg/l
  BOD:
    criteria_name: BOD (5 days 20C)
    rule: max
    high: 3.0
    scale: 3.0
    unit: mg/l

# 2026 designated ghats (context only; used for blind spots and labels).
designated_ghats_csv: data/context/designated_ghats_2026.csv
scores_json: data/derived/ghat_scores.json

# Scoring (Appendix A). Every number the engine uses is here.
scoring:
  # baseline = breach_rate * w + mean_exceedance * w   (pre-immersion readings only)
  baseline_weights: {breach_rate: 0.5, mean_exceedance: 0.5}
  # festival effect per festival-year-parameter: worsening pre->during and pre->after
  festival_weights: {during: 0.7, after: 0.3}
  # risk = 100 * (baseline * w + festival * w)
  risk_weights: {baseline: 0.5, festival: 0.5}
  # Tier cut-offs on the 0-100 risk score: High >= high; Medium >= medium; else Low.
  # Calibrated in Level 2 (placeholders 60/35 put all 7 ghats in Low; observed
  # range 13.9-33.6). Anchored to the driver cut-offs, not fitted to the scores:
  #   high   27.5 = 100 * (0.5 * 0.40 + 0.5 * 0.15)  -> "poor before" AND "worsens" levels
  #   medium 20.0 = 100 * (0.5 * 0.40)               -> "poor before" level alone
  # See docs/METHOD.md (D1).
  tiers: {high: 27.5, medium: 20}
  # Team's own flag (not a CPCB limit): any reported DO of exactly this value.
  critical: {parameter: Dissolved oxygen, value: 0, tier_floor: High}
  # Driver label cut-offs (0-1 scale).
  driver: {baseline: 0.40, festival: 0.15}
  # Confidence = valid scored readings / expected scored readings.
  confidence: {high: 0.90, medium: 0.70}
  # If the most recent Durga table is absent, confidence is at most this.
  latest_durga_missing_cap: Medium
