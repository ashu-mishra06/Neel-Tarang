# Visarjan Ghat Watch - rules readable by non-coders.
# Every threshold, limit and weight used by the engine lives here.

standard: CPCB class B (outdoor bathing)

data:
  readings_csv: data/bhopal_ghats_2023_2025.csv
  limits_csv: data/cpcb_water_quality_criteria.csv

# Column names in the organisers' CSV. The loader uses the first name it finds
# in each list. Add a name here if the organisers' file uses a different one.
readings_columns:
  ghat: [ghat, ghat_name, site, site_name]
  parameter: [parameter, param]
  value: [value, reading, result]
  flag: [flag, value_flag, remark, remarks]
  year: [year]
  festival: [festival]
  phase: [phase]
  source_page: [source_page, page]

# Flag text (case and surrounding spaces ignored).
flags:
  missing: ["not sampled", "*", "**"]          # shown as missing, never clean
  below_detection: ["BDL", "ND"]               # very low, NOT zero, NOT missing

# CPCB criteria file (columns: class, parameter, limit_type, limit, unit).
limits_csv:
  class_name: B

# Scored parameters with class B limits.
#   rule: min   -> breach if value <  low  (higher is better)
#   rule: max   -> breach if value >  high (lower is better)
#   rule: range -> breach if value outside [low, high]
#   scale: divisor that turns "how far past the limit" into 0..1 (Appendix A)
#   criteria_name: the parameter's name in the CPCB criteria CSV
# The limits below must equal the class B rows of the CPCB criteria CSV;
# load_limits() stops with an error if they differ.
scored_parameters:
  pH:
    criteria_name: pH
    rule: range
    low: 6.5
    high: 8.5
    scale: 1.5
    unit: ""
  Dissolved oxygen:
    criteria_name: Dissolved oxygen
    rule: min
    low: 5.0
    scale: 5.0
    unit: mg/l
  BOD:
    criteria_name: BOD (5 days 20C)
    rule: max
    high: 3.0
    scale: 3.0
    unit: mg/l

# 2026 designated ghats (context only; used for blind spots and labels).
designated_ghats_csv: data/context/designated_ghats_2026.csv
scores_json: data/derived/ghat_scores.json

# Scoring (Appendix A). Every number the engine uses is here.
scoring:
  # baseline = breach_rate * w + mean_exceedance * w   (pre-immersion readings only)
  baseline_weights: {breach_rate: 0.5, mean_exceedance: 0.5}
  # festival effect per festival-year-parameter: worsening pre->during and pre->after
  festival_weights: {during: 0.7, after: 0.3}
  # How per-parameter festival effects combine into one festival score:
  #   max             -> the worst parameter's mean triple score (DEFAULT, decided 11 Oct 2026)
  #   mean_of_triples -> mean over all triples of all parameters (original Appendix A rule)
  festival_aggregation: max
  # risk = 100 * (baseline * w + festival * w)
  risk_weights: {baseline: 0.5, festival: 0.5}
  # Tier cut-offs on the 0-100 risk score: High >= high; Medium >= medium; else Low.
  # Calibrated in Level 2 (placeholders 60/35 put all 7 ghats in Low). Derived
  # from the driver cut-offs (baseline 0.40, festival 0.15) and risk weights,
  # NOT fitted to the scores, and NOT re-tuned after the festival change:
  #   high   27.5 = 100 * (0.5 * 0.40 + 0.5 * 0.15)  ghat at the baseline cut-off and at
  #                  festival 0.15 (the festival driver cut-off until 11 Oct 2026)
  #   medium 20.0 = 100 * (0.5 * 0.40 + 0.5 * 0.00)  ghat at the baseline cut-off, no worsening
  # The arithmetic is derived; choosing "baseline cut-off alone" as the
  # Medium anchor is a judgement. See docs/METHOD.md (D1).
  tiers: {high: 27.5, medium: 20}
  # Team's own flag (not a CPCB limit): any reported DO of exactly this value.
  critical: {parameter: Dissolved oxygen, value: 0, tier_floor: High}
  # Driver label.
  #   "poor before": baseline score >= baseline (0-1 scale).
  #   "worsens": a PHYSICAL anchor on matched pairs (same festival-year table,
  #   valid pre AND valid during), averaged per parameter over its matched tables:
  #     - DO  : mean(pre - during)  >= 1.0 mg/l, or
  #     - BOD : mean(during - pre)  >= 1.0 mg/l, or
  #     - crossing: for any scored parameter, the matched-pair mean of pre is
  #       within the limit AND the matched-pair mean of during breaches it.
  #   JUDGEMENT (reviewer proposal, 11 Oct 2026): 1 mg/l is a round, readable
  #   change, not a CPCB number. Written after Malikhedi's matched DO pairs had been
  #   seen, before any other ghat's matched-pair results; not tuned after.
  driver:
    baseline: 0.40
    worsening_mg_l: {Dissolved oxygen: 1.0, BOD: 1.0}
    crossing: true
  # Retired as a driver cut-off on 11 Oct 2026. Kept only because the High
  # tier line (27.5) was derived from it; see tiers above.
  festival_tier_anchor: 0.15
  # Risk within this many points of a tier line -> near_boundary = true.
  near_boundary_points: 1.5
  # Confidence = valid scored readings / expected scored readings.
  confidence: {high: 0.90, medium: 0.70}
  # A during/after reading that breaches but cannot be compared with a pre
  # reading (an "unpaired breach") may hide worsening. If a ghat has any,
  # confidence drops this many levels (floor Low). JUDGEMENT.
  unpaired_breach_downgrade: 1
  # If the most recent Durga table is absent, confidence is at most this.
  latest_durga_missing_cap: Medium
  # If the ghat's site name match is "medium" (may be two places), confidence
  # is at most this.
  site_match_medium_cap: Medium

# MPPCB reports: evidence links open url#page=<source_page>; page images are
# rendered from the local PDF. page_range = pages where the Bhopal tables sit
# (checked against the CSV on 11 Oct 2026).
reports:
  "2023":
    name: MPPCB Idol Immersion Report 2023 (CPCB format)
    url: https://www.mppcb.mp.gov.in/proc/mon/Idol_immer._Report_23_CPCB.pdf
    file: resources/Idol_immer._Report_23_CPCB.pdf
    page_range: [26, 61]
  "2024":
    name: MPPCB Ganesh and Durga Visarjan Report 2024
    url: https://www.mppcb.mp.gov.in/proc/mon/Ganesh_and_Durga_visarjan_report-2024.pdf
    file: resources/Ganesh_and_Durga_visarjan_report-2024.pdf
    page_range: [23, 72]
  "2025":
    name: MPPCB Ganesh and Durga Visarjan Report 2025
    url: https://www.mppcb.mp.gov.in/proc/mon/Ganesh_and_Durga_visarjan_report-2025.pdf
    file: resources/Ganesh_and_Durga_visarjan_report-2025.pdf
    page_range: [28, 65]
pages_cache_dir: data/derived/pages
evidence_csv: data/derived/evidence.csv
gap_register_json: data/derived/gap_register.json

# Forwardable brief (Level 5).
brief:
  date_en: 20 Oct 2026
  date_hi: 20 अक्टूबर 2026
  top_n: 3

# 7A persistence badge (Appendix F.1). Display only: never changes the ranking.
persistence:
  phases: [during, pre]
  min_tables: 3          # Y below this -> "Too few tables"
  repeat_fraction: [2, 3]   # X >= ceil(2/3 * Y) -> "Repeat" (exact integer maths)

# 7B test planner (Appendix F.2). Display only: never changes the ranking.
planner:
  u_weight: 1.0        # priority = risk * (1 + u_weight * (1 - coverage))
  default_n: 3
  include_no_data_default: true
