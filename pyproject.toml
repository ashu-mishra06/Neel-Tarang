[project]
name = "visarjan-ghat-watch"
version = "0.1.0"
description = "Rank Bhopal immersion ghats by why they are risky, with traceable evidence."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
